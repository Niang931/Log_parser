# The logpipe landing page in production. Traefik (installed by deploy/ansible)
# terminates TLS and routes by the labels below; nothing here publishes a port.
# Lives on the VPS at /opt/logpipe-landing next to a .env the deploy workflow
# writes (see deploy/.env.example).
#
#   docker compose -f docker-compose.prod.yml ps
#   docker compose -f docker-compose.prod.yml logs -f web

name: logpipe-landing

services:
  web:
    image: ${IMAGE_PREFIX:?}/logpipe-landing:${IMAGE_TAG:?}
    restart: unless-stopped
    networks: [edge]
    labels:
      traefik.enable: "true"
      traefik.http.routers.logpipe-landing.rule: Host(`${SITE_DOMAIN:?}`)
      traefik.http.routers.logpipe-landing.entrypoints: websecure
      traefik.http.services.logpipe-landing.loadbalancer.server.port: "80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  # Traefik's network, created by the Ansible playbook.
  edge:
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true
