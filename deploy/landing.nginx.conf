# Serves the landing page. TLS and routing are Traefik's; this only hands out files.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;

    location / {
        try_files $uri $uri/ =404;
    }

    # Vite hashes these filenames, so they can be cached for good.
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html names the current hashed bundle, so it revalidates on every visit.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
