[project]
name = "log-parser"
version = "0.1.0"
description = "Log parser with anomoly detection and schema insertion for visualization"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepparse-artifact[llm,web]",
    "clickhouse-connect>=1.11.0",
    "confluent-kafka>=2.6",
    "numpy>=2.5.4",
    "torch>=2.4",
    "tqdm>=4.66",
]

[project.scripts]
logpipe = "logpipe.cli:main"

[dependency-groups]
dev = [
    "deepparse-artifact[test]",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "hypothesis>=6.170.9",
    "types-tqdm>=4.70.0.20260906",
    "pytest-cov>=7.1.0",
]

[tool.uv.sources]
deepparse-artifact = { path = "DeepParse", editable = true }
torch = { index = "pytorch-cpu" }

# CPU-only torch wheels (~200MB instead of ~2GB of CUDA libraries).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["logpipe*"]

[tool.setuptools.package-data]
logpipe = ["storage/*.sql"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: tests that need running services such as ClickHouse or Kafka",
    "slow: tests that train a model or take more than a few seconds",
]

[tool.ruff]
line-length = 100
extend-exclude = ["DeepParse"]

[tool.pyright]
include = ["logpipe", "tests"]
venvPath = "."
venv = ".venv"
# DeepParse is an editable install via an import hook, which pyright can't follow.
extraPaths = ["DeepParse"]
