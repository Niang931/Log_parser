services:
  clickhouse:
    image: "clickhouse/clickhouse-server:25.8"
    container_name: logpipe_clickhouse
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user $${CLICKHOUSE_USER} --password $${CLICKHOUSE_PASSWORD} -q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Alternative store: `docker compose --profile mongo up -d mongo` (or `--profile platform-mongo up --build`
  # for the whole platform on it). Auth is on: users are created from docker/mongo-init.js on the first
  # start only, so an old volume without them needs `down -v`. Localhost only.
  mongo:
    profiles: [mongo, platform-mongo]
    image: "mongo:8.2"
    container_name: logpipe_mongo
    ports:
      - "127.0.0.1:27017:27017"
    command: ["mongod", "--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-}
      MONGO_DB: ${MONGO_DB:-logpipe}
      MONGO_APP_USER: ${MONGO_APP_USER:-logpipe}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-}
      MONGO_RO_USER: ${MONGO_RO_USER:-logpipe_ro}
      MONGO_RO_PASSWORD: ${MONGO_RO_PASSWORD:-}
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Unresolved queue: one Kafka broker in KRaft mode (no ZooKeeper). Reachable
  # from the host at localhost:9092 (KAFKA_BOOTSTRAP in .env).
  kafka:
    image: "apache/kafka:3.9.1"
    container_name: logpipe_kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_ADVERTISED_HOST:-localhost}:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  # --- the agent platform: `docker compose --profile platform up --build` ---------------
  # logpipe server (UI on http://localhost:8080), storing in the clickhouse service above.
  server:
    profiles: [platform]
    build: .
    image: ghcr.io/minhthien2103/logpipe-server:latest
    container_name: logpipe_server
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      LLM_BACKEND: ${LLM_BACKEND:-offline}
      # Accepted as an agent API key, so the compose agent can ship before you create keys in the UI.
      LOGPIPE_BOOTSTRAP_KEY: ${LOGPIPE_BOOTSTRAP_KEY:-lp_compose_demo_key}
      # UI login. Unset: generated on first start and printed (`docker compose logs server`).
      LOGPIPE_ADMIN_PASSWORD: ${LOGPIPE_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
    volumes:
      - server_data:/app/artifacts
    depends_on:
      clickhouse:
        condition: service_healthy

  # Same server image on MongoDB. Passwords with `@ : / ?` must be URL-encoded in the URIs below.
  server_mongo:
    profiles: [platform-mongo]
    build: .
    image: ghcr.io/minhthien2103/logpipe-server:latest
    container_name: logpipe_server_mongo
    command: ["logpipe", "server", "--host", "0.0.0.0", "--port", "8080", "--store", "mongodb"]
    environment:
      MONGO_URI: mongodb://${MONGO_APP_USER:-logpipe}:${MONGO_APP_PASSWORD:-}@mongo:27017/?authSource=${MONGO_DB:-logpipe}
      MONGO_READONLY_URI: mongodb://${MONGO_RO_USER:-logpipe_ro}:${MONGO_RO_PASSWORD:-}@mongo:27017/?authSource=${MONGO_DB:-logpipe}
      MONGO_DB: ${MONGO_DB:-logpipe}
      LLM_BACKEND: ${LLM_BACKEND:-offline}
      LOGPIPE_BOOTSTRAP_KEY: ${LOGPIPE_BOOTSTRAP_KEY:-lp_compose_demo_key}
      LOGPIPE_ADMIN_PASSWORD: ${LOGPIPE_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
    volumes:
      - server_data:/app/artifacts
    depends_on:
      mongo:
        condition: service_healthy

  # Writes a live app log (with Java stack traces) and an nginx access log for the agent to tail.
  loggen:
    profiles: [platform]
    image: python:3.13-alpine
    container_name: logpipe_loggen
    command: ["python", "/loggen.py", "/logs"]
    volumes:
      - ./examples/loggen.py:/loggen.py:ro
      - demo_logs:/logs

  # A collector agent tracking shop.log from examples/agent/conf.d. access.log is left for you to
  # add from the UI (Agents -> compose-agent -> Push sources) to see a new-source warning.
  agent:
    profiles: [platform]
    build: agent
    image: ghcr.io/minhthien2103/logpipe-agent:latest
    container_name: logpipe_agent
    environment:
      LOGPIPE_ENDPOINT: http://server:8080
      LOGPIPE_API_KEY: ${LOGPIPE_BOOTSTRAP_KEY:-lp_compose_demo_key}
      LOGPIPE_HOSTNAME: compose-agent
    volumes:
      - ./examples/agent/conf.d/shop.yaml:/etc/logpipe-agent/conf.d/shop.yaml:ro
      - demo_logs:/logs:ro
      - agent_data:/var/lib/logpipe-agent
    depends_on: [server, loggen]

volumes:
  clickhouse_data:
  mongo_data:
  kafka_data:
  server_data:
  demo_logs:
  agent_data:
