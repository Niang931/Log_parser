name: CI

on:
  pull_request:
  push:
    branches: [main]

# New push to same PR cancel the going run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Offline LLM adapter
  LLM_BACKEND: offline
  PYTHONUTF8: "1"
  UV_LOCKED: "1"      # fail instead of re-resolving uv.lock

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7     # Download code
      - uses: astral-sh/setup-uv@v7   # Download uv
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            DeepParse/uv.lock
      - run: uv python install 3.13
      - run: uv sync --group dev
      - name: ruff check
        run: uv run ruff check logpipe tests
      - name: ruff format --check
        run: uv run ruff format --check logpipe tests

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            DeepParse/uv.lock
      - run: uv python install 3.13
      - run: uv sync --group dev
      - name: logpipe tests (not integration) with coverage
        run: >
          uv run pytest -m "not integration"
          --cov=logpipe --cov-report=term-missing --cov-report=xml:coverage.xml
          -p no:cacheprovider
      - name: DeepParse tests (not integration)
        run: uv run pytest DeepParse/tests -m "not integration" -p no:cacheprovider
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  integration:
    name: Integration (ClickHouse)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        ports:
          - 8123:8123
          - 9000:9000
        env:
          CLICKHOUSE_USER: logpipe
          CLICKHOUSE_PASSWORD: ci-password
          CLICKHOUSE_DB: logpipe
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "clickhouse-client --user logpipe --password ci-password -q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CLICKHOUSE_HOST: 127.0.0.1
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: logpipe
      CLICKHOUSE_PASSWORD: ci-password
      CLICKHOUSE_DB: logpipe
      STORE: clickhouse
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            DeepParse/uv.lock
      - run: uv python install 3.13
      - run: uv sync --group dev
      - name: integration tests
        run: uv run pytest -m integration -p no:cacheprovider


  security:
    name: Security (pip-audit, gitleaks, Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read  # gitleaks lists a PR's commits
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks reads the commits of the push / PR
      - uses: astral-sh/setup-uv@v7
      - name: pip-audit (uv.lock)
        # torch's +cpu wheels aren't on PyPI, so pip-audit skips it (and says so).
        run: |
          uv export --frozen --no-hashes --no-emit-project --no-emit-workspace --format requirements-txt \
            | grep -v '^-e ' > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --disable-pip --no-deps --progress-spinner off
      - name: npm audit (web, production deps)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      - name: gitleaks (secrets in commits)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy (vulnerable dependencies, committed secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy (Dockerfile misconfigurations, advisory)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        continue-on-error: true  # the server image still runs as root
        with:
          scan-type: config
          severity: CRITICAL,HIGH
          exit-code: "1"
  integration-mongo:
    name: Integration (MongoDB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:8.2
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            DeepParse/uv.lock
      - run: uv python install 3.13
      - run: uv sync --group dev
      - name: integration tests
        run: uv run pytest -m integration -p no:cacheprovider tests/test_mongo_integration.py tests/test_server_mongo.py
      - name: server tests on MongoDB
        run: STORE=mongodb uv run pytest -p no:cacheprovider tests/test_server.py

  agent:
    name: Agent (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  web:
    name: Web UI (React)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build   # type-checks first
